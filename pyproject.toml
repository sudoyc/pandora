[project]
name = "pandora"
version = "0.2.0"
description = "Open the box. Browse, search, and download from ExHentai — daemon + CLI + agent workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "rich>=14.3.3",
    "tomli-w>=1.0",
    "uvicorn>=0.34",
    "websockets>=16.0",
    "pillow>=11.0",
    "aiosqlite>=0.22.1",
    "pypdf>=6.12.0",
]

[project.scripts]
pandora = "pandora_daemon.cli:main"
pandora-daemon = "pandora_daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exhentai_api", "pandora_daemon"]

[dependency-groups]
dev = [
    "jsonschema>=4.25.1",
    "markdown-it-py>=4.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
