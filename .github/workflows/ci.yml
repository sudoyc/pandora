name: CI

'on':
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.11.30'
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Check locks, docs, schemas, and whitespace
        run: uv run --frozen python scripts/check.py --group repository

  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.11.30'
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Run Python tests
        run: uv run --frozen python scripts/check.py --group python

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.11.30'
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pandora-web/package-lock.json
      - name: Lint and build Web
        run: uv run --frozen python scripts/check.py --group web
